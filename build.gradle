// Top-level build file where you can add configuration options common to all sub-projects/modules.

plugins {
    id 'com.android.application' version '8.11.2' apply false
    id 'com.android.library' version '8.11.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.8.10' apply false
    id 'com.google.dagger.hilt.android' version '2.41' apply false
    id("com.google.devtools.ksp") version "1.8.10-1.0.9" apply false
}

apply from: this.rootProject.file('config.gradle')

/*
 * 为所有使用 Kotlin 的模块统一固定 Java 工具链为 17。
 *
 * 背景：Kotlin Gradle Plugin 1.8.10 不认识 JVM target 20 / 21，而 KGP 会从
 * “运行 Gradle 的那个 JDK”推断 jvmTarget。Android Studio 默认用自带的 JBR(21)
 * 运行 Gradle，于是配置阶段直接抛：
 *     java.lang.IllegalArgumentException: Unknown Kotlin JVM target: 21
 * 即使模块里已经显式写了 kotlinOptions.jvmTarget = "17" 也无效——KGP 仍会去解析
 * 由 Java 工具链推导出的 convention 值（配置缓存序列化时必然触发）。
 *
 * 显式声明工具链后，jvmTarget 一律由固定的 17 推导，构建不再依赖环境 JDK 版本，
 * JDK 17 / 21 / 22 下均可正常构建。
 * 参考实现：lib_database_room/build.gradle.kts 中的 kotlin { jvmToolchain(17) }。
 */
subprojects { subproject ->
    subproject.plugins.withId('org.jetbrains.kotlin.android') {
        def kotlinExt = subproject.extensions.findByName('kotlin')
        if (kotlinExt != null) {
            kotlinExt.jvmToolchain(17)
        }
    }
}



task clean(type: Delete) {
    delete rootProject.buildDir
}